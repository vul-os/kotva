[package]
name = "kotva-core"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
# The KOTVA substrate core: crypto suites, content addressing, identity lifecycle, the 8-word
# key-name, and the MOTE object. Carved from envoir's `dmtap-core` (the wire — DS-tags, suites,
# CBOR — is unchanged: this crate implements the DMTAP/KOTVA-Mail wire byte-for-byte). Pinned by
# tag; consumers never track HEAD (the isango guardrail).
description = "KOTVA substrate core — crypto suites, content addressing, identity lifecycle, the 8-word key-name, and the MOTE object (KOTVA spec §1, §2)"
repository = "https://github.com/vul-os/kotva"
homepage = "https://github.com/vul-os/kotva"
keywords = ["kotva", "mote", "decentralized", "identity", "crypto"]
categories = ["cryptography", "email"]

[dependencies]
# --- Canonical deterministic CBOR (spec §18.1.1) — the SHARED codec, not a local copy ----------
# `cbor::encode`/`cbor::decode` are thin adapters over this crate. The byte layer lives in
# `kotva-cbor` because the family grew four copies of it with no cross-check between any two, and a
# duplicated invariant that drifts is worse than either copy alone: signatures and content
# addresses only mean something if independent implementations agree byte for byte. `kotva-cbor`
# carries the frozen 183-vector evermesh conformance corpus that proves they do.
#
# It has ZERO dependencies, so this adds no transitive weight — see that crate's manifest header.
# `Cv` (integer-keyed, no null, no negative integers) remains kotva-core's own narrower value type
# and its public API is unchanged; only the byte-level encoder/decoder moved.
kotva-cbor = { version = "0.1.0", path = "../kotva-cbor" }
# --- Signing (spec §1.1 suite 0x01: Ed25519, RFC 8032) ---
ed25519-dalek = { version = "2", features = ["rand_core"] }
# --- KEM key material (spec §1.1: X25519, RFC 7748) ---
x25519-dalek = { version = "2", features = ["static_secrets"] }
# --- HPKE payload sealing (spec §2.4; RFC 9180 DHKEM(X25519)/HKDF-SHA256/ChaCha20Poly1305) ---
hpke = "0.12"
# --- Suite 0x02 (PQ hybrid) crypto — spec §1.1, §1.3, §16.7, §18.1.6 ------------------------
# X-Wing hybrid KEM (draft-connolly-cfrg-xwing-kem, draft 06): X25519 ⊕ ML-KEM-768 with the
# IND-CCA SHA3-256 combiner, so Envelope confidentiality holds if EITHER share is unbroken.
# `getrandom` gives the no-arg `generate_keypair()`/`encapsulate()` (the crate's rand_core is a
# different major than ours, so we avoid crossing an RNG-version boundary by hand).
# Maturity note: `x-wing` 0.1.0 is a young pure-Rust crate tracking the draft — real X-Wing, not a
# placeholder, but not yet an audited 1.0; it is the closest audited-ish option to the spec's KEM.
x-wing = { version = "0.1.0", features = ["getrandom"] }
# ML-DSA-65 / FIPS 204 (RustCrypto) post-quantum signatures. Composed AND-wise with Ed25519 so a
# forgery requires breaking BOTH. `Signer` here is the deterministic ML-DSA variant (no RNG arg).
ml-dsa = "0.1.1"
# AEAD over the hybrid KEM's derived content key — ChaCha20-Poly1305, matching suite 0x01's AEAD.
chacha20poly1305 = "0.10"
# --- Hashing / content addressing (spec §2.2, §3.9: BLAKE3-256 with agility prefix) ---
blake3 = "1"
# --- Deterministic CBOR (spec §README, RFC 8949) ---
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
# --- KDF for blinded delivery tags (spec §2.2a: BT = HKDF(shared_secret, epoch_day)) ---
hkdf = "0.12"
sha2 = "0.10"
# --- Unicode NFC quick-check for §25.3.4 rule 1 (a decoder MUST reject non-NFC topic labels;
# UAX #15). Only the precompiled NFC quick-check tables are used (is_nfc), not full normalization. ---
unicode-normalization = "0.1"
# --- RNG ---
rand_core = { version = "0.6", features = ["getrandom"] }
# --- Errors ---
thiserror = "1"

[dev-dependencies]
# Conformance vector generation + self-check (examples/gen_vectors.rs, tests/conformance_vectors.rs).
serde_json = "1"
