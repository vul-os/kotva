# KOTVA Rust crates — the substrate implementation carved out of envoir so consumers (the envoir
# node, the Ephor broker) can depend on a stable, *tag-pinned* core instead of tracking a moving
# path dependency (the isango churn lesson). The spec itself remains prose in this repo; these
# crates are the reference implementation of the substrate wire.
#
# Consumers pin a git tag, never HEAD:
#   kotva-core = { git = "https://github.com/vul-os/kotva", tag = "core-v0.2.0" }
#
# envoir keeps its existing `use dmtap_core::…` code via cargo's dependency-rename:
#   dmtap-core = { package = "kotva-core", git = "…", tag = "core-v0.2.0" }
#
# The carve-out is now COMPLETE. `kotva-sync` / `kotva-sync-wasm` (formerly envoir's `dmtap-sync` /
# `dmtap-sync-wasm`) and `bindings/go` moved here too, because sync is a SUBSTRATE capability
# (`substrate/SYNC.md`) and adopters were reaching into a product to get it — every adopter manifest
# read `git = "https://github.com/vul-os/envoir"`. Naming ruling: substrate capability -> `kotva-*`,
# mail-profile capability -> `dmtap-*`. The Rust module paths (`dmtap_core::`, `dmtap_sync::`) are
# unchanged everywhere by dependency-rename, so no consumer source moved.
#
# no-broker-dep:allow-file: line 2 names Ephor only as an example downstream consumer of this
# tag-pinned workspace (kotva has no dependency on it — this manifest is the one being depended
# ON). `cargo tree` over the workspace's default features contains no broker crate.

[workspace]
resolver = "2"
members = [
    "crates/kotva-cbor",
    "crates/kotva-coordinator",
    "crates/kotva-core",
    "crates/kotva-depot",
    "crates/kotva-mail",
    "crates/kotva-sync",
    "crates/kotva-sync-wasm",
]
